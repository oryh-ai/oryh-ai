# GENERATED by scripts/build_content.py from mkdocs.base.yml + allowlist.yml.
# Edit those, not this file.
site_name: ORYH
site_description: An AI-native OA/BPM platform where the business logic lives in agents.
site_url: https://oryh-ai.github.io/oryh-ai/
repo_url: https://github.com/AIE-enginehub/oryh
repo_name: AIE-enginehub/oryh
copyright: Apache-2.0 · ORYH is a trademark of its owner — see TRADEMARK.md
docs_dir: content
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  - search.suggest
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- search
- i18n:
    docs_structure: suffix
    languages:
    - locale: en
      default: true
      name: English
      build: true
    - locale: zh
      name: 简体中文
      build: true
      nav_translations:
        Platform: 平台
        Business objects: 业务对象
        Writing: 文章
        Home: 首页
        It started with a timesheet: 从一张工时单开始
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
nav:
- Home: index.md
- Platform:
  - AI-native OA/BPM positioning: platform/ai-native-platform.md
  - Capabilities, Skills and the API: platform/capabilities-skills-api.md
  - Scoped capabilities for self-authored Skills: platform/scoped-skill-capabilities.md
  - Agent self-connect (device flow): platform/device-flow.md
- Business objects:
  - Company rules: objects/policies.md
  - Billing accounts: objects/billing-accounts.md
  - Customers: objects/customers.md
  - Leave: objects/leave.md
  - Payroll: objects/payroll.md
  - Invoices, payments and settlement: objects/receivables-payables.md
- Writing:
  - It started with a timesheet: writing/01-it-started-with-a-timesheet.md
