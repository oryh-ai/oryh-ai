# GENERATED by scripts/build_content.py from mkdocs.base.yml + allowlist.yml.
# Edit those, not this file.
site_name: ORYH
site_description: An AI-native OA/BPM platform where the business logic lives in agents.
site_url: https://oryh-ai.github.io/oryh-ai/
repo_url: https://github.com/AIE-enginehub/Oryh
repo_name: AIE-enginehub/Oryh
copyright: Apache-2.0 · ORYH is a trademark of its owner — see TRADEMARK.md
docs_dir: content
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  - search.suggest
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- search
- i18n:
    docs_structure: suffix
    languages:
    - locale: en
      default: true
      name: English
      build: true
    - locale: zh
      name: 简体中文
      build: true
      nav_translations:
        User manual: 使用手册
        Platform: 平台
        Business objects: 业务对象
        Writing: 文章
        Home: 首页
        Overview: 手册总览
        Install: 安装部署
        First boot: 首次启动
        Connect your agent: 接入你的 Agent
        Set up the workspace: 初始化工作区
        Daily use: 日常使用
        Administration: 管理控制台
        Operations: 运维
        It started with a timesheet: 从一张工时单开始
        What if the ERP user is an agent?: 如果用 ERP 的主要是 Agent
        Software keeps the records, agents handle the logic: 软件负责记录，Agent 负责逻辑
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
nav:
- Home: index.md
- User manual:
  - Overview: manual/index.md
  - Install: manual/install.md
  - First boot: manual/first-boot.md
  - Connect your agent: manual/connect-agent.md
  - Set up the workspace: manual/workspace.md
  - Daily use: manual/daily-use.md
  - Administration: manual/administration.md
  - Operations: manual/operations.md
- Writing:
  - It started with a timesheet: writing/01-it-started-with-a-timesheet.md
  - What if the ERP user is an agent?: writing/02-when-agents-use-erp.md
  - Software keeps the records, agents handle the logic: writing/03-software-records-agents-decide.md
